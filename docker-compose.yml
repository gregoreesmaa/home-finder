services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: homefinder
      POSTGRES_PASSWORD: homefinder
      POSTGRES_DB: homefinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  scoring:
    build: ./services/scoring
    environment:
      DATABASE_URL: postgresql://homefinder:homefinder@db:5432/homefinder
      # Persisted ingest cache: container cron reuses geocode/POI responses
      # instead of cold-start hammering Nominatim/Overpass (#78).
      HF_CACHE_DIR: /var/cache/home-finder
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/var/cache/home-finder
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_SCORING_URL: http://localhost:8000
      # Map data path (docs/layers.md §1): local 2026-09-12 snapshot with
      # raster masters + sidecars; container HOME is /root.
      HF_SNAPSHOT_DIR: /root/hf-data/2026-09-12
      # Ookla quarterly extract (2026-Q1: 971 fixed + 555 mobile tiles).
      OOKLA_SNAPSHOT_PATH: /root/hf-data/2026-09-12/ookla/ookla-tallinn-2026Q1.json
      # sensor.community daily extract (Tallinn bbox).
      SENSCOM_SNAPSHOT_PATH: /root/hf-data/2026-09-12/senscom/sensor-community-tallinn.json
      # Pole live tables (DATEX/outage, #776): the Mac ssh tunnel listens
      # on Mac-loopback 127.0.0.1:18001, which inside a container is the
      # container itself — so containers reach the Mac via
      # host.docker.internal (verified 200 from compose web 2026-09-19
      # against the loopback-bound tunnel). extra_hosts keeps the name
      # resolving on Linux docker too (Desktop already defines it).
      # Override per-operator when the tunnel binds a LAN address:
      # POLE_BASE_URL=http://<mac-lan-ip>:18001 docker compose up.
      POLE_BASE_URL: ${POLE_BASE_URL:-http://host.docker.internal:18001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - ${HOME}/hf-data:/root/hf-data:ro
    depends_on:
      - scoring

volumes:
  pgdata:
  hf-cache:
