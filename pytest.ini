# Batch raster builders live in scripts/build/ (batch_b5_*.py, issue #102):
# pytest skips directories named `build` by default (norecursedirs), which
# would silently exclude them from `python3 -m pytest scripts/ -q`. Keep
# every other default so collection elsewhere is unchanged.
[pytest]
norecursedirs = .* dist CVS _darcs {arch} *.egg venv
